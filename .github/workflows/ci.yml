name: CI

# Pull requests only. Branch and tag pushes get the same gate from bundle.yml,
# which must call it directly because `publish` cannot depend on a job in another
# workflow. Triggering here on push too ran the whole five-mode suite twice.
on:
  pull_request:

permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-typecheck:
    name: Tests & Type Check
    uses: ./.github/workflows/verify.yml
