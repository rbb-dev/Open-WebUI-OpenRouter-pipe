name: Bundle Pipe

on:
  push:
    branches: ['**']     # all branches, including ones containing a slash
    tags: ['v*']         # Create release on version tags (v2.0.3, v2.1.0, etc.)
  workflow_dispatch:     # Manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  bundle:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No rebuild here. This republishes the artifacts the verify job built and ran the
      # five-mode suite against, so what ships is byte-for-byte what was tested -- the
      # previous shape rebuilt them in a different environment and nothing compared the
      # two.
      - name: Download the verified bundles
        uses: actions/download-artifact@v4
        with:
          name: verified-bundles-${{ github.run_id }}

      - name: Slugify the ref name
        id: slug
        run: |
          echo "ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open_webui_openrouter_pipe_bundled-${{ steps.slug.outputs.ref }}
          path: |
            open_webui_openrouter_pipe_bundled.py
            open_webui_openrouter_pipe_bundled_compressed.py
            open_webui_openrouter_pipe_bundled_no_plugins.py
            open_webui_openrouter_pipe_bundled_compressed_no_plugins.py
          retention-days: 90

  publish:
    name: Publish
    needs: [verify, bundle]
    timeout-minutes: 20
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for release notes generation

      - name: Slugify the ref name
        id: slug
        run: |
          echo "ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Download the verified bundles
        uses: actions/download-artifact@v4
        with:
          name: open_webui_openrouter_pipe_bundled-${{ steps.slug.outputs.ref }}

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Get previous version tag (or first commit if no previous tag)
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)

          # Commit list with links, each subject cut at 200 columns, in a file: inline notes can exceed the runner's argument limit
          {
            echo "## Changes"
            echo ""
            git log --pretty=format:"- [\`%h\`](https://github.com/${{ github.repository }}/commit/%H) %<(200,trunc)%s" "${PREV_TAG}..HEAD" | sed 's/[[:space:]]*$//'
            echo ""
            echo ""
            echo "**Full list:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
          } > release-notes.md

      # Create versioned release on tag push (v2.0.3, v2.1.0, etc.)
      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            open_webui_openrouter_pipe_bundled.py
            open_webui_openrouter_pipe_bundled_compressed.py
            open_webui_openrouter_pipe_bundled_no_plugins.py
            open_webui_openrouter_pipe_bundled_compressed_no_plugins.py
          body_path: release-notes.md

      # Update "dev" pre-release on dev branch push
      - name: Update dev release
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build
          body: |
            ⚠️ **Development build — may be unstable.**

            This is an automatically updated release containing the latest bundled pipe from the `dev` branch.

            For stable versions, use the [latest release](../../releases/latest) instead.

            **Direct downloads:**
            - [open_webui_openrouter_pipe_bundled.py](../../releases/download/dev/open_webui_openrouter_pipe_bundled.py)
            - [open_webui_openrouter_pipe_bundled_compressed.py](../../releases/download/dev/open_webui_openrouter_pipe_bundled_compressed.py)
            - [open_webui_openrouter_pipe_bundled_no_plugins.py](../../releases/download/dev/open_webui_openrouter_pipe_bundled_no_plugins.py)
            - [open_webui_openrouter_pipe_bundled_compressed_no_plugins.py](../../releases/download/dev/open_webui_openrouter_pipe_bundled_compressed_no_plugins.py)
          files: |
            open_webui_openrouter_pipe_bundled.py
            open_webui_openrouter_pipe_bundled_compressed.py
            open_webui_openrouter_pipe_bundled_no_plugins.py
            open_webui_openrouter_pipe_bundled_compressed_no_plugins.py
          prerelease: true
          make_latest: false  # Don't mark as "Latest" (that's for versioned releases)
