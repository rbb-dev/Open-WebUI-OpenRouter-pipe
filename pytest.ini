[pytest]
addopts = -p open_webui_openrouter_pipe.pytest_bootstrap -p pytest_asyncio.plugin -p pytest_timeout
timeout = 60
timeout_method = thread
testpaths = tests
pythonpath = . filters
norecursedirs = backups
markers =
    real_clock: needs a real event loop, not the jumping test clock
    jumping_clock: runs its async tests on the jumping test clock, an event loop that skips ahead to its next timer instead of waiting for it
